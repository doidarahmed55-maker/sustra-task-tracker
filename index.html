<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUSTRA Task Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface-0:#f5f4f0;--surface-1:#eeecea;--surface-2:#fff;
  --text-primary:#1a1a18;--text-secondary:#5f5e5a;--text-muted:#888780;
  --border:#e0deda;--border-strong:#c8c6c0;
  --accent:#185FA5;--accent-bg:#E6F1FB;--accent-tx:#185FA5;
  --success-bg:#E1F5EE;--success-tx:#0F6E56;
  --danger-bg:#FCEBEB;--danger-tx:#A32D2D;
  --warning-bg:#FAEEDA;--warning-tx:#854F0B;
  --radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface-0);color:var(--text-primary);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:24px 16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:0.5px solid var(--border)}
.logo{font-size:20px;font-weight:600;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface-1);border-radius:var(--radius);padding:3px}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);transition:all .15s;font-family:inherit}
.tab.active{background:var(--surface-2);color:var(--text-primary);font-weight:500;border:0.5px solid var(--border)}
.section{display:none}.section.active{display:block}

/* Cards */
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px 20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.stat-num{font-size:28px;font-weight:500}

/* Buttons */
.btn{padding:7px 14px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:background .12s}
.btn:hover{background:var(--surface-1)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#0f4a8a}
.btn-sm{padding:4px 10px;font-size:12px}
.icon-btn{width:28px;height:28px;border:0.5px solid var(--border);border-radius:var(--radius);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px}
.icon-btn:hover{background:var(--surface-1);color:var(--text-primary)}

/* Forms */
.input{width:100%;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-1);color:var(--text-primary);font-size:13px;font-family:inherit}
.input:focus{outline:none;border-color:var(--accent)}
.select{width:100%;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-1);color:var(--text-primary);font-size:13px;font-family:inherit}
textarea.input{min-height:70px;resize:vertical}
.form-group{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:24px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:500;margin-bottom:16px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Engineers */
.eng-list{display:flex;flex-direction:column;gap:8px}
.eng-row{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px 20px}
.eng-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;flex-shrink:0}
.eng-name{font-size:15px;font-weight:500}
.eng-role{font-size:12px;color:var(--text-secondary)}
.task-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:0.5px solid var(--border)}
.task-name{font-size:13px;flex:1}
.deadline{font-size:11px;color:var(--text-muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-on-track{background:var(--success-bg);color:var(--success-tx)}
.badge-late{background:var(--danger-bg);color:var(--danger-tx)}
.badge-done{background:var(--accent-bg);color:var(--accent-tx)}
.badge-at-risk{background:var(--warning-bg);color:var(--warning-tx)}
.progress-bar{height:4px;background:var(--surface-0);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:500}
.empty{text-align:center;padding:48px 16px;color:var(--text-muted);font-size:14px}
.pct{font-size:12px;color:var(--text-secondary);min-width:32px;text-align:right}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.color-opt.sel{border-color:#333}

/* Updates */
.update-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:8px}
.update-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.update-text{font-size:13px;color:var(--text-primary);line-height:1.6}
.note-text{font-size:12px;color:var(--text-secondary);font-style:italic;margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border)}
.today-badge{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--warning-bg);color:var(--warning-tx)}

/* PDF Review */
.pdf-drop-zone{border:1.5px dashed var(--border-strong);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface-1)}
.pdf-drop-zone:hover,.pdf-drop-zone.drag-over{border-color:var(--accent);background:var(--accent-bg)}
.pdf-drop-icon{font-size:32px;margin-bottom:12px;color:var(--text-muted)}
.pdf-drop-text{font-size:14px;color:var(--text-secondary)}
.pdf-drop-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.review-form{margin-top:16px}
.review-output{margin-top:20px}
.review-section{margin-bottom:20px}
.review-section-title{font-size:13px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--border)}
.review-item{display:flex;gap:10px;margin-bottom:8px;font-size:13px;line-height:1.6}
.review-num{min-width:22px;height:22px;background:var(--accent-bg);color:var(--accent-tx);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;margin-top:1px}
.review-bullet{min-width:8px;height:8px;background:var(--danger-tx);border-radius:50%;flex-shrink:0;margin-top:6px}
.review-bullet.pattern{background:var(--warning-tx)}
.review-bullet.positive{background:var(--success-tx)}
.loading-bar{height:3px;background:var(--accent-bg);border-radius:2px;overflow:hidden;margin-top:12px}
.loading-fill{height:100%;background:var(--accent);border-radius:2px;animation:loading 1.5s ease-in-out infinite}
@keyframes loading{0%{width:0;margin-right:100%}50%{width:60%;margin-right:0}100%{width:0;margin-right:0;margin-left:100%}}
.file-info{display:flex;align-items:center;gap:10px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.file-name{font-size:13px;font-weight:500;flex:1}
.file-size{font-size:12px;color:var(--text-muted)}
.report-header{background:var(--accent);color:#fff;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.report-title{font-size:17px;font-weight:600;margin-bottom:4px}
.report-meta{font-size:12px;opacity:.8}

.download-bar{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:0.5px solid var(--border)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">SUSTRA <span>Task</span></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('dash')">📊 Dashboard</button>
      <button class="tab" onclick="switchTab('updates')">🕐 Updates</button>
    </div>
  </div>

  <!-- DASHBOARD = Engineers + Tasks + Stats -->
  <div id="sec-dash" class="section active">
    <!-- Stats -->
    <div class="grid-4" id="stat-cards"></div>

    <!-- Missing alert -->
    <div id="missing-alert" style="display:none;background:var(--warning-bg);border:0.5px solid var(--warning-tx);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--warning-tx)"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="section-title">الفريق</span>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="showWeeklyReport()">📊 أسبوعي</button>
        <button class="btn" onclick="remindAll()" style="background:#25D366;color:#fff;border-color:#25D366">📱 Remind All</button>
        <button class="btn btn-primary" onclick="openModal('eng')">+ مهندس جديد</button>
      </div>
    </div>
    <div class="eng-list" id="dash-list"></div>
  </div>

  <!-- UPDATES = Archive + Search -->
  <div id="sec-updates" class="section">
    <div class="toolbar">
      <span class="section-title">Updates</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <select class="select" id="filter-eng" onchange="renderUpdates()" style="flex:1;min-width:140px">
        <option value="">كل المهندسين</option>
      </select>
      <input class="input" type="date" id="filter-date" onchange="renderUpdates()" style="flex:1;min-width:140px">
      <input class="input" id="filter-search" placeholder="🔍 ابحث..." oninput="renderUpdates()" style="flex:1;min-width:140px">
      <button class="btn" onclick="clearFilters()">✕ مسح</button>
    </div>
    <div id="updates-list"></div>
  </div>

  <!-- WEEKLY REPORT MODAL -->
  <div id="modal-weekly" class="modal-overlay" style="display:none">
    <div class="modal" style="width:540px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">📊 التقرير الأسبوعي — جاهز للنسخ</div>
      <div id="weekly-report-content" style="font-family:monospace;font-size:12.5px;line-height:1.8;background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;padding:14px;white-space:pre-wrap;color:var(--text-primary);max-height:60vh;overflow-y:auto"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('weekly')">إغلاق</button>
        <button class="btn" onclick="exportReportPDF('weekly')">⬇️ PDF</button>
        <button class="btn btn-primary" onclick="copyWeeklyReport()">📋 نسخ التقرير</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS REPORT MODAL -->
  <div id="modal-progress" class="modal-overlay" style="display:none">
    <div class="modal" style="width:520px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">📋 تقرير التقدم — جاهز للنسخ</div>
      <div id="progress-report-content" style="font-family:monospace;font-size:12.5px;line-height:1.8;background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;padding:14px;white-space:pre-wrap;color:var(--text-primary);max-height:60vh;overflow-y:auto"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('progress')">إغلاق</button>
        <button class="btn" onclick="exportReportPDF('progress')">⬇️ PDF</button>
        <button class="btn btn-primary" onclick="copyProgressReport()">📋 نسخ التقرير</button>
      </div>
    </div>
  </div>

  <!-- HISTORY MODAL -->
  <div id="modal-history" class="modal-overlay" style="display:none">
    <div class="modal" style="width:480px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">🕐 History التاسك</div>
      <div id="history-content"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('history')">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- TASK REMIND PICKER MODAL -->
  <div id="modal-remind" class="modal-overlay" style="display:none">
    <div class="modal" style="width:360px">
      <div class="modal-title">📱 اختار التاسك اللي هتبعته</div>
      <div id="remind-tasks-list" style="margin-bottom:12px"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('remind')">إلغاء</button>
        <button class="btn btn-primary" onclick="sendWhatsApp(window._remindEngId)">📱 بعت كل التاسكات</button>
      </div>
    </div>
  </div>

  <!-- PDF REVIEW REMOVED -->
  <div id="sec-review" class="section" style="display:none!important">
    <div class="toolbar">
      <span class="section-title">PDF Review</span>
    </div>

    <div class="pdf-drop-zone" id="drop-zone" onclick="document.getElementById('pdf-input').click()"
         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      <div class="pdf-drop-icon">📄</div>
      <div class="pdf-drop-text">اسحب الـ PDF المعلّم هنا أو اضغط للاختيار</div>
      <div class="pdf-drop-sub">الـ PDF اللي كتبت عليه ملاحظاتك</div>
    </div>
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none" onchange="handleFile(event)">

    <div id="file-preview" style="display:none;margin-top:12px"></div>

    <div class="review-form card" id="review-form" style="display:none;margin-top:12px">
      <div class="form-group">
        <label class="form-label">المهندس صاحب الشغل</label>
        <select class="select" id="review-eng-select"><option value="">— اختار مهندس —</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">سياق إضافي (اختياري)</label>
        <textarea class="input" id="review-context" placeholder="مثلاً: المرحلة الثالثة، التركيز على الحديد والغطاء الخرساني..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="generateReview()" id="gen-btn">✨ توليد Review Report</button>
    </div>

    <div id="review-output"></div>
  </div>
</div>

<!-- MODALS -->
<div id="modal-eng" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title" id="modal-eng-title">مهندس جديد</div>
    <div class="form-group"><label class="form-label">الاسم</label><input class="input" id="inp-eng-name" placeholder="اسم المهندس"></div>
    <div class="form-group"><label class="form-label">الدور / التخصص</label><input class="input" id="inp-eng-role" placeholder="مثلاً: تفصيل حديد، BIM Coordinator"></div>
    <div class="form-group"><label class="form-label">رقم الواتساب (مع كود الدولة)</label><input class="input" id="inp-eng-phone" placeholder="مثلاً: 201012345678"></div>
    <div class="form-group"><label class="form-label">لون</label><div class="colors" id="color-opts"></div></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('eng')">إلغاء</button>
      <button class="btn btn-primary" id="btn-save-eng" onclick="saveEng()">إضافة</button>
    </div>
  </div>
</div>

<div id="modal-task" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title" id="modal-task-title">تاسك جديد</div>
    <div class="form-group"><label class="form-label">اسم التاسك</label><input class="input" id="inp-task-name" placeholder="مثلاً: شوب دروينج عمود C3"></div>
    <div class="form-group"><label class="form-label">الديدلاين</label><input class="input" type="date" id="inp-task-deadline"></div>
    <div class="form-group"><label class="form-label">الحالة</label>
      <select class="select" id="inp-task-status">
        <option value="on-track">On Track</option>
        <option value="at-risk">At Risk</option>
        <option value="late">Late</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">نسبة الإنجاز: <span id="pct-lbl">0%</span></label>
      <input type="range" min="0" max="100" value="0" step="5" id="inp-task-pct" oninput="document.getElementById('pct-lbl').textContent=this.value+'%'">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('task')">إلغاء</button>
      <button class="btn btn-primary" id="btn-save-task" onclick="saveTask()">إضافة</button>
    </div>
  </div>
</div>

<div id="modal-update" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">تحديث يومي</div>
    <div class="form-group"><label class="form-label">المهندس</label><select class="select" id="inp-upd-eng" onchange="fillTasksDropdown()"></select></div>
    <div class="form-group"><label class="form-label">التاسك المرتبط</label><select class="select" id="inp-upd-task" onchange="fillCurrentPct()"><option value="">— اختياري —</option></select></div>
    <div class="form-group" id="pct-group" style="display:none">
      <label class="form-label">تحديث نسبة الإنجاز: <span id="upd-pct-lbl">0%</span></label>
      <input type="range" min="0" max="100" value="0" step="5" id="inp-upd-pct" oninput="document.getElementById('upd-pct-lbl').textContent=this.value+'%'">
    </div>
    <div class="form-group"><label class="form-label">وصل لفين النهارده</label><textarea class="input" id="inp-upd-text" placeholder="مثلاً: خلّص تفصيل الأعمدة من C1 لـ C8، باقي الكمرات..."></textarea></div>
    <div class="form-group"><label class="form-label">ملاحظاتك على الشغل</label><textarea class="input" id="inp-upd-note" placeholder="مثلاً: الغطاء الخرساني غلط في 3 عناصر، يراجع..."></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('update')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveUpdate()">حفظ</button>
    </div>
  </div>
</div>

<script>
const COLORS=[
  {bg:'#E6F1FB',tx:'#185FA5'},{bg:'#E1F5EE',tx:'#0F6E56'},
  {bg:'#EEEDFE',tx:'#534AB7'},{bg:'#FAEEDA',tx:'#854F0B'},
  {bg:'#FAECE7',tx:'#993C1D'},{bg:'#EAF3DE',tx:'#3B6D11'},
];
let selColor=0;
let engineers=[];
let updates=[];
let currentEngId=null;
let selectedPdfBase64=null;
let selectedPdfName=null;

// ---- UTILS ----
function uid(){return Math.random().toString(36).slice(2,8)}
function progressColor(s){return s==='done'?'#378ADD':s==='late'?'#E24B4A':s==='at-risk'?'#EF9F27':'#1D9E75'}
const statusLabel={'on-track':'On Track','at-risk':'At Risk','late':'Late','done':'Done'};

// ---- TABS ----
function switchTab(t){
  ['dash','updates'].forEach((s,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',s===t);
    document.getElementById('sec-'+s).classList.toggle('active',s===t);
  });
  if(t==='dash')renderDash();
  if(t==='updates')renderUpdates();
}

// ---- MODALS ----
let editEngId=null;
let editTaskId=null;

function quickUpdate(engId, taskId){
  // open update modal pre-filled
  const s=document.getElementById('inp-upd-eng');
  s.innerHTML=engineers.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  s.value=engId;
  fillTasksDropdown();
  document.getElementById('inp-upd-task').value=taskId;
  fillCurrentPct();
  document.getElementById('inp-upd-text').value='';
  document.getElementById('inp-upd-note').value='';
  document.getElementById('modal-update').style.display='flex';
}

function openModal(type){
  if(type==='eng'){
    editEngId=null;
    document.getElementById('modal-eng-title').textContent='مهندس جديد';
    document.getElementById('btn-save-eng').textContent='إضافة';
    selColor=0;initColors();
    clearEls(['inp-eng-name','inp-eng-role','inp-eng-phone']);
  }
  if(type==='task'){
    editTaskId=null;
    document.getElementById('modal-task-title').textContent='تاسك جديد';
    document.getElementById('btn-save-task').textContent='إضافة';
    clearEls(['inp-task-name','inp-task-deadline']);
    document.getElementById('inp-task-status').value='on-track';
    document.getElementById('inp-task-pct').value=0;
    document.getElementById('pct-lbl').textContent='0%';
  }
  if(type==='update'){
    const s=document.getElementById('inp-upd-eng');
    s.innerHTML=engineers.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
    fillTasksDropdown();
    clearEls(['inp-upd-text','inp-upd-note']);
  }
  document.getElementById('modal-'+type).style.display='flex';
}
function closeModal(type){document.getElementById('modal-'+type).style.display='none'}
function clearEls(ids){ids.forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})}

// ---- COLORS ----
function initColors(){
  document.getElementById('color-opts').innerHTML=COLORS.map((c,i)=>
    `<div class="color-opt${i===selColor?' sel':''}" style="background:${c.bg};border-color:${i===selColor?c.tx:'transparent'}" onclick="pickColor(${i})"></div>`
  ).join('');
}
function pickColor(i){selColor=i;initColors()}

// ---- ENGINEERS ----
function saveEng(){
  const name=document.getElementById('inp-eng-name').value.trim();
  if(!name)return;
  const role=document.getElementById('inp-eng-role').value.trim();
  if(editEngId){
    const eng=engineers.find(e=>e.id===editEngId);
    if(eng){eng.name=name;eng.role=role;eng.color=COLORS[selColor];}
    editEngId=null;
  }else{
    engineers.push({id:uid(),name,role,color:COLORS[selColor],tasks:[]});
  }
  closeModal('eng');renderEngineers();renderDash();
}

function editEng(id){
  const eng=engineers.find(e=>e.id===id);
  if(!eng)return;
  editEngId=id;
  document.getElementById('modal-eng-title').textContent='تعديل بيانات المهندس';
  document.getElementById('btn-save-eng').textContent='حفظ التعديل';
  document.getElementById('inp-eng-name').value=eng.name;
  document.getElementById('inp-eng-role').value=eng.role||'';
  document.getElementById('inp-eng-phone').value=eng.phone||'';
  selColor=COLORS.findIndex(c=>c.bg===eng.color.bg);
  if(selColor<0)selColor=0;
  initColors();
  document.getElementById('modal-eng').style.display='flex';
}

function addTask(engId){currentEngId=engId;editTaskId=null;openModal('task')}

function editTask(engId,taskId){
  const eng=engineers.find(e=>e.id===engId);
  if(!eng)return;
  const task=eng.tasks.find(t=>t.id===taskId);
  if(!task)return;
  currentEngId=engId;
  editTaskId=taskId;
  document.getElementById('modal-task-title').textContent='تعديل التاسك';
  document.getElementById('btn-save-task').textContent='حفظ التعديل';
  document.getElementById('inp-task-name').value=task.name;
  document.getElementById('inp-task-deadline').value=task.deadline||'';
  document.getElementById('inp-task-status').value=task.status;
  document.getElementById('inp-task-pct').value=task.pct;
  document.getElementById('pct-lbl').textContent=task.pct+'%';
  document.getElementById('modal-task').style.display='flex';
}

function saveTask(){
  const name=document.getElementById('inp-task-name').value.trim();
  if(!name)return;
  const eng=engineers.find(e=>e.id===currentEngId);
  if(!eng)return;
  const taskData={name,deadline:document.getElementById('inp-task-deadline').value,status:document.getElementById('inp-task-status').value,pct:parseInt(document.getElementById('inp-task-pct').value)};
  if(editTaskId){
    const t=eng.tasks.find(t=>t.id===editTaskId);
    if(t)Object.assign(t,taskData);
    editTaskId=null;
  }else{
    eng.tasks.push({id:uid(),...taskData});
  }
  closeModal('task');renderEngineers();renderDash();
}

function deleteEng(id){engineers=engineers.filter(e=>e.id!==id);renderEngineers();renderDash()}
function deleteTask(eId,tId){const e=engineers.find(x=>x.id===eId);if(e)e.tasks=e.tasks.filter(t=>t.id!==tId);renderEngineers();renderDash()}

function archiveTask(eId,tId){
  const e=engineers.find(x=>x.id===eId);
  const t=e?e.tasks.find(t=>t.id===tId):null;
  if(t){t.archived=true;renderEngineers();renderDash();}
}
function unarchiveTask(eId,tId){
  const e=engineers.find(x=>x.id===eId);
  const t=e?e.tasks.find(t=>t.id===tId):null;
  if(t){t.archived=false;renderEngineers();renderDash();}
}

let taskHistoryCache={};
async function showTaskHistory(taskId){
  document.getElementById('history-content').innerHTML='<div style="padding:16px;color:var(--text-muted);font-size:13px">⏳ جاري التحميل...</div>';
  document.getElementById('modal-history').style.display='flex';
  try{
    const rows=await sbFetch('/rest/v1/task_history?task_id=eq.'+taskId+'&order=changed_at.desc');
    if(!rows.length){
      document.getElementById('history-content').innerHTML='<div style="padding:16px;color:var(--text-muted);font-size:13px">لسه مفيش تعديلات مسجلة على التاسك ده</div>';
      return;
    }
    const fieldLabel={'status':'الحالة','pct':'نسبة الإنجاز','name':'الاسم','deadline':'الديدلاين'};
    document.getElementById('history-content').innerHTML=rows.map(r=>`
      <div style="display:flex;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)">
        <div style="min-width:8px;height:8px;background:var(--accent);border-radius:50%;margin-top:5px;flex-shrink:0"></div>
        <div style="flex:1">
          <div style="font-size:12px;color:var(--text-muted)">${new Date(r.changed_at).toLocaleDateString('ar-EG',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div>
          <div style="font-size:13px;color:var(--text-primary);margin-top:2px">
            <b>${fieldLabel[r.field]||r.field}</b>: 
            <span style="text-decoration:line-through;color:var(--text-muted)">${r.old_value||'—'}</span>
            → <span style="color:var(--accent)">${r.new_value||'—'}</span>
          </div>
        </div>
      </div>`).join('');
  }catch(e){
    document.getElementById('history-content').innerHTML=`<div style="padding:16px;color:var(--danger-tx);font-size:13px">❌ ${e.message}</div>`;
  }
}

function remindAll(){
  const toRemind=engineers.filter(e=>e.phone&&e.tasks.some(t=>t.status!=='done'&&!t.archived));
  if(!toRemind.length){showToast('مفيش مهندسين عندهم تاسكات شغالة أو مش عندهم رقم');return;}
  let i=0;
  function sendNext(){
    if(i>=toRemind.length){showToast('✅ تم إرسال كل الـ Reminders');return;}
    const eng=toRemind[i];
    const activeTasks=eng.tasks.filter(t=>t.status!=='done'&&!t.archived);
    const taskLine=activeTasks.map(t=>t.name).join(', ');
    const msg=`Hi ${eng.name}, please send your daily progress update for: ${taskLine}. Thanks 🙏`;
    window.open(`https://wa.me/${eng.phone}?text=${encodeURIComponent(msg)}`,'_blank');
    i++;
    if(i<toRemind.length){
      showToast(`📱 ${i}/${toRemind.length} — اضغط مرة تانية للي جاي`);
      setTimeout(()=>{
        if(confirm(`تبعت لـ ${eng.name}؟\nاضغط OK للي جاي: ${toRemind[i].name}`)) sendNext();
      },1000);
    }else{
      showToast('✅ تم إرسال كل الـ Reminders');
    }
  }
  if(confirm(`هتبعت Reminder لـ ${toRemind.length} مهندسين:\n${toRemind.map(e=>e.name).join('\n')}\n\nتكمل؟`)) sendNext();
}

function remindWithTask(engId){
  const eng=engineers.find(e=>e.id===engId);
  if(!eng||!eng.phone)return;
  window._remindEngId=engId;
  const activeTasks=eng.tasks.filter(t=>t.status!=='done'&&!t.archived);
  if(!activeTasks.length){showToast('مفيش تاسكات شغالة');return;}
  if(activeTasks.length===1){
    sendTaskWhatsApp(engId,activeTasks[0].id);
    return;
  }
  document.getElementById('remind-tasks-list').innerHTML=activeTasks.map(t=>`
    <button onclick="sendTaskWhatsApp('${engId}','${t.id}');closeModal('remind')"
      style="display:block;width:100%;text-align:right;padding:10px 14px;margin-bottom:6px;border:0.5px solid var(--border);border-radius:8px;background:var(--surface-1);cursor:pointer;font-size:13px;font-family:inherit">
      <div style="font-weight:500">${t.name}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${statusLabel[t.status]} · ${t.pct}%</div>
    </button>`).join('');
  document.getElementById('modal-remind').style.display='flex';
}

function sendTaskWhatsApp(engId,taskId){
  const eng=engineers.find(e=>e.id===engId);
  if(!eng||!eng.phone)return;
  const task=eng.tasks.find(t=>t.id===taskId);
  if(!task)return;
  const msg=`Hi ${eng.name}, please send your daily progress update for:\n📋 ${task.name} (${task.pct}% complete)\nThanks 🙏`;
  window.open(`https://wa.me/${eng.phone}?text=${encodeURIComponent(msg)}`,'_blank');
}

function sendWhatsApp(engId){
  const eng=engineers.find(e=>e.id===engId);
  if(!eng||!eng.phone)return;
  const activeTasks=eng.tasks.filter(t=>t.status!=='done');
  const taskLine=activeTasks.length
    ? activeTasks.map(t=>t.name).join(', ')
    : 'your current tasks';
  const msg=`Hi ${eng.name}, please send your daily progress update for: ${taskLine}. Thanks 🙏`;
  window.open(`https://wa.me/${eng.phone}?text=${encodeURIComponent(msg)}`,'_blank');
}

  const alert=document.getElementById('missing-alert');
  if(!alert)return;
  const today=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
  const engWithUpdate=new Set(updates.filter(u=>u.date===today).map(u=>u.engId));
  const missing=engineers.filter(e=>e.tasks.some(t=>t.status!=='done')&&!engWithUpdate.has(e.id));

function saveUpdate(){
  const engId=document.getElementById('inp-upd-eng').value;
  const text=document.getElementById('inp-upd-text').value.trim();
  if(!text)return;
  const eng=engineers.find(e=>e.id===engId);
  const taskId=document.getElementById('inp-upd-task').value;
  const task=eng&&taskId?eng.tasks.find(t=>t.id===taskId):null;
  const newPct=task?parseInt(document.getElementById('inp-upd-pct').value):null;
  const isoDate=new Date().toISOString().slice(0,10);
  const date=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
  const note=document.getElementById('inp-upd-note').value.trim();
  if(task&&newPct!==null){task.pct=newPct;}
  updates.unshift({
    id:uid(),engId,engName:eng?.name||'',color:eng?.color||COLORS[0],
    taskName:task?task.name:'',text,note,date,isoDate,newPct
  });

function showProgressReport(engId){
  const eng=engineers.find(e=>e.id===engId);
  if(!eng)return;
  const today=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  const statusAr={'on-track':'On Track','at-risk':'At Risk','late':'Late','done':'Done'};
  let report=`SUSTRA — Progress Report\n`;
  report+=`المهندس: ${eng.name}${eng.role?' ('+eng.role+')':''}\n`;
  report+=`التاريخ: ${today}\n`;
  report+=`${'─'.repeat(45)}\n\n`;

  const activeTasks=eng.tasks.filter(t=>t.status!=='done');
  const doneTasks=eng.tasks.filter(t=>t.status==='done');

  if(activeTasks.length){
    report+=`التاسكات الجارية:\n\n`;
    activeTasks.forEach(t=>{
      const lastUpd=updates.find(u=>u.engId===eng.id&&u.taskName===t.name);
      report+=`📋 ${t.name}\n`;
      report+=`   الحالة: ${statusAr[t.status]||t.status} | الإنجاز: ${t.pct}%${t.deadline?' | الديدلاين: '+t.deadline:''}\n`;
      if(lastUpd){
        report+=`   آخر تحديث (${lastUpd.date}): ${lastUpd.text}\n`;
        if(lastUpd.note) report+=`   ملاحظة: ${lastUpd.note}\n`;
      }else{
        report+=`   آخر تحديث: —\n`;
      }
      report+=`\n`;
    });
  }

  if(doneTasks.length){
    report+=`التاسكات المنتهية:\n`;
    doneTasks.forEach(t=>{report+=`✅ ${t.name}\n`;});
    report+=`\n`;
  }

  if(!activeTasks.length&&!doneTasks.length){
    report+=`لا يوجد تاسكات مسجلة.\n`;
  }

  report+=`${'─'.repeat(45)}\nGenerated by SUSTRA Task Tracker`;
  document.getElementById('progress-report-content').textContent=report;
  window._progressReportText=report;
  window._currentReportEng=eng.name+(eng.role?' ('+eng.role+')':'');
  document.getElementById('modal-progress').style.display='flex';
}

function exportReportPDF(type){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210,PH=297,M=14;
  const BLUE=[24,95,165],BLUE_L=[230,241,251],GRAY=[95,94,90],DARK=[26,26,24];
  const isWeekly=type==='weekly';
  const text=isWeekly?(window._weeklyReportText||''):(window._progressReportText||'');
  const filename=isWeekly?'SUSTRA_Weekly_Report.pdf':'SUSTRA_Progress_Report.pdf';
  const today=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  // ── HEADER BAR
  doc.setFillColor(...BLUE);
  doc.rect(0,0,PW,18,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('SUSTRA',M,11);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('Task Tracker  |  '+(isWeekly?'Weekly Progress Report':'Engineer Progress Report'),M+32,11);
  doc.setFontSize(8);
  doc.text(today,PW-M,11,'right');

  // ── WATERMARK
  doc.saveGraphicsState();
  doc.setGState(new doc.GState({opacity:0.05}));
  doc.setTextColor(...BLUE);
  doc.setFontSize(60);
  doc.setFont('helvetica','bold');
  doc.text('SUSTRA',PW/2,PH/2,'center',{angle:30});
  doc.restoreGraphicsState();

  // ── META BAR
  doc.setFillColor(...BLUE_L);
  doc.rect(0,18,PW,10,'F');
  doc.setTextColor(...DARK);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);

  // parse engineer name from stored meta
  const eng=window._currentReportEng||'';
  const metaItems=isWeekly
    ?[['Type','Weekly Report'],['Period','Last 7 Days'],['Date',today],['By','Ahmed M. Mostafa']]
    :[[' Engineer',eng||'—'],['Date',today],['Status','Progress Report'],['By','Ahmed M. Mostafa']];
  const cw=(PW-2*M)/metaItems.length;
  metaItems.forEach(([label,val],i)=>{
    const x=M+i*cw;
    doc.setFont('helvetica','bold');
    doc.setTextColor(...BLUE);
    doc.setFontSize(6.5);
    doc.text(label.toUpperCase(),x,23);
    doc.setFont('helvetica','normal');
    doc.setTextColor(...DARK);
    doc.setFontSize(8);
    doc.text(val,x,27);
  });

  // ── LINE
  doc.setDrawColor(...BLUE);
  doc.setLineWidth(0.4);
  doc.line(M,29,PW-M,29);

  // ── CONTENT
  let y=37;
  const lines=text.split('\n');
  const statusColors={'On Track':[15,110,86],'At Risk':[133,79,11],'Late':[163,45,45],'Done':[24,95,165]};

  lines.forEach(line=>{
    if(y>PH-22){
      doc.addPage();
      // repeat header on new page
      doc.setFillColor(...BLUE);
      doc.rect(0,0,PW,12,'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.text('SUSTRA — '+(isWeekly?'Weekly Report':'Progress Report'),M,8);
      doc.setFont('helvetica','normal');
      doc.text(today,PW-M,8,'right');
      y=20;
    }

    const trimmed=line.trim();

    // Skip empty separator lines (─ ═)
    if(/^[─═]+$/.test(trimmed)){
      doc.setDrawColor(...BLUE_L);
      doc.setLineWidth(0.3);
      doc.line(M,y,PW-M,y);
      y+=4;
      return;
    }

    if(!trimmed){y+=3;return;}

    // Engineer name line (👤)
    if(trimmed.startsWith('👤')||trimmed.startsWith('SUSTRA')){
      doc.setFillColor(...BLUE_L);
      doc.roundedRect(M,y-4,PW-2*M,8,1,1,'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(10);
      doc.setTextColor(...BLUE);
      doc.text(trimmed.replace('👤','').trim(),M+3,y+0.5);
      y+=11;
      return;
    }

    // Task line (📋)
    if(trimmed.startsWith('📋')){
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.setTextColor(...DARK);
      doc.text('▸ '+trimmed.replace('📋','').trim(),M+4,y);
      y+=5;
      return;
    }

    // Status/Progress line
    if(trimmed.startsWith('الحالة:')||trimmed.startsWith('الإنجاز:')||trimmed.includes('|')){
      // draw progress bar if has %
      const pctMatch=trimmed.match(/الإنجاز:\s*(\d+)%/);
      if(pctMatch){
        const pct=parseInt(pctMatch[1]);
        const bw=60,bx=M+8;
        doc.setFillColor(220,220,220);
        doc.roundedRect(bx,y-2.5,bw,3,1.5,1.5,'F');
        const barColor=pct>=70?[15,110,86]:pct>=40?[133,79,11]:[163,45,45];
        doc.setFillColor(...barColor);
        doc.roundedRect(bx,y-2.5,bw*pct/100,3,1.5,1.5,'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(7.5);
        doc.setTextColor(...barColor);
        doc.text(`${pct}%`,bx+bw+2,y);
        doc.setFont('helvetica','normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...GRAY);
        doc.text(trimmed.replace(/الإنجاز:\s*\d+%/,'').replace(/\|/g,'·').trim(),bx+bw+14,y);
        y+=6;
        return;
      }
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(...GRAY);
      doc.text(trimmed,M+8,y);
      y+=4.5;
      return;
    }

    // Update lines (•)
    if(trimmed.startsWith('•')){
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(...DARK);
      const wrapped=doc.splitTextToSize(trimmed,PW-2*M-12);
      wrapped.forEach((wl,i)=>{
        if(i===0)doc.text(wl,M+8,y);
        else doc.text(wl,M+10,y);
        y+=4;
      });
      return;
    }

    // Note lines
    if(trimmed.startsWith('ملاحظة:')){
      doc.setFont('helvetica','oblique');
      doc.setFontSize(7.5);
      doc.setTextColor(...GRAY);
      const wrapped=doc.splitTextToSize(trimmed,PW-2*M-12);
      wrapped.forEach(wl=>{doc.text(wl,M+8,y);y+=3.8;});
      return;
    }

    // Done tasks (✅)
    if(trimmed.startsWith('✅')){
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(15,110,86);
      doc.text(trimmed,M+4,y);
      y+=4.5;
      return;
    }

    // Default
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(...DARK);
    const wrapped=doc.splitTextToSize(trimmed,PW-2*M);
    wrapped.forEach(wl=>{doc.text(wl,M,y);y+=4;});
  });

  // ── FOOTER
  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFillColor(...BLUE);
    doc.rect(0,PH-8,PW,8,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','normal');
    doc.setFontSize(6.5);
    doc.text('SUSTRA Task Tracker  |  Confidential – Internal Use Only  |  © 2026',PW/2,PH-3,'center');
    doc.text(`${i} / ${totalPages}`,PW-M,PH-3,'right');
  }

  doc.save(filename);
}

function showWeeklyReport(){
  const now=new Date();
  const weekAgo=new Date(now-7*24*60*60*1000);
  const weekUpdates=updates.filter(u=>{
    if(!u.isoDate)return false;
    return new Date(u.isoDate)>=weekAgo;
  });
  const from=weekAgo.toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
  const to=now.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  const statusAr={'on-track':'On Track','at-risk':'At Risk','late':'Late','done':'Done'};

  let report=`SUSTRA — Weekly Progress Report\n`;
  report+=`الفترة: ${from} → ${to}\n`;
  report+=`${'═'.repeat(45)}\n\n`;

  engineers.forEach(eng=>{
    const engUpdates=weekUpdates.filter(u=>u.engId===eng.id);
    const activeTasks=eng.tasks.filter(t=>!t.archived);
    report+=`👤 ${eng.name}${eng.role?' ('+eng.role+')':''}\n`;
    report+=`   التحديثات هذا الأسبوع: ${engUpdates.length}\n`;

    if(activeTasks.length){
      activeTasks.forEach(t=>{
        const taskUpds=engUpdates.filter(u=>u.taskName===t.name);
        report+=`\n   📋 ${t.name}\n`;
        report+=`      الحالة: ${statusAr[t.status]||t.status} | الإنجاز: ${t.pct}%${t.deadline?' | الديدلاين: '+t.deadline:''}\n`;
        if(taskUpds.length){
          report+=`      التحديثات (${taskUpds.length}):\n`;
          taskUpds.forEach(u=>{
            report+=`      • ${u.date}: ${u.text}\n`;
            if(u.note) report+=`        ملاحظة: ${u.note}\n`;
          });
        }else{
          report+=`      لا يوجد تحديثات هذا الأسبوع\n`;
        }
      });
    }else{
      report+=`   لا يوجد تاسكات نشطة\n`;
    }
    report+=`\n${'─'.repeat(45)}\n\n`;
  });

  report+=`Generated by SUSTRA Task Tracker`;
  document.getElementById('weekly-report-content').textContent=report;
  window._weeklyReportText=report;
  document.getElementById('modal-weekly').style.display='flex';
}

function renderDash(){
  const total=engineers.length;
  const totalT=engineers.reduce((a,e)=>a+e.tasks.filter(t=>!t.archived).length,0);
  const done=engineers.reduce((a,e)=>a+e.tasks.filter(t=>t.status==='done').length,0);
  const late=engineers.reduce((a,e)=>a+e.tasks.filter(t=>t.status==='late'&&!t.archived).length,0);
  document.getElementById('stat-cards').innerHTML=`
    <div class="card"><div class="stat-label">👥 المهندسين</div><div class="stat-num">${total}</div></div>
    <div class="card"><div class="stat-label">📋 التاسكات</div><div class="stat-num">${totalT}</div></div>
    <div class="card"><div class="stat-label" style="color:var(--success-tx)">✅ خلصت</div><div class="stat-num" style="color:var(--success-tx)">${done}</div></div>
    <div class="card"><div class="stat-label" style="color:var(--danger-tx)">⚠️ متأخرة</div><div class="stat-num" style="color:var(--danger-tx)">${late}</div></div>
  `;
  checkMissingUpdates();
  const list=document.getElementById('dash-list');
  if(!engineers.length){list.innerHTML='<div class="empty">اضغط "+ مهندس جديد" للبدء</div>';return}

  function deadlineBadge(deadline,status){
    if(!deadline||status==='done')return '';
    const d=Math.ceil((new Date(deadline)-new Date())/(1000*60*60*24));
    if(d<0)return `<span style="font-size:11px;background:#FCEBEB;color:#A32D2D;padding:1px 6px;border-radius:8px;font-weight:500">متأخر ${Math.abs(d)} يوم</span>`;
    if(d<=2)return `<span style="font-size:11px;background:#FCEBEB;color:#A32D2D;padding:1px 6px;border-radius:8px;font-weight:500">⚠️ ${d} يوم</span>`;
    if(d<=5)return `<span style="font-size:11px;background:#FAEEDA;color:#854F0B;padding:1px 6px;border-radius:8px;font-weight:500">${d} يوم</span>`;
    return `<span style="font-size:11px;color:var(--text-muted)">${deadline}</span>`;
  }

  list.innerHTML=engineers.map(eng=>{
    const activeTasks=eng.tasks.filter(t=>!t.archived);
    const doneCount=eng.tasks.filter(t=>t.status==='done').length;
    const avg=activeTasks.length?Math.round(activeTasks.reduce((a,t)=>a+t.pct,0)/activeTasks.length):0;
    const lateT=activeTasks.filter(t=>t.status==='late');
    const urgentT=activeTasks.filter(t=>{
      if(!t.deadline||t.status==='done')return false;
      const d=Math.ceil((new Date(t.deadline)-new Date())/(1000*60*60*24));
      return d<=2&&d>=0;
    });
    const isAlert=lateT.length>0||urgentT.length>0;
    return`<div class="eng-row" style="${isAlert?'border-color:#E24B4A;border-width:1px':''}">
      <div class="eng-header">
        <div class="avatar" style="background:${eng.color.bg};color:${eng.color.tx}">${eng.name.slice(0,2)}</div>
        <div style="flex:1">
          <div class="eng-name">${eng.name}</div>
          <div class="eng-role">${eng.role||''} · ${activeTasks.length} تاسك · ${doneCount} خلصوا · ${avg}%</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${eng.phone?`<button class="icon-btn" title="Remind — اختار تاسك" onclick="remindWithTask('${eng.id}')" style="background:#25D366;color:#fff;border-color:#25D366">📱</button>`:''}
          <button class="btn btn-sm" onclick="showProgressReport('${eng.id}')">📋</button>
          <button class="btn btn-sm" onclick="addTask('${eng.id}')">+ تاسك</button>
          <button class="icon-btn" onclick="editEng('${eng.id}')">✏️</button>
          <button class="icon-btn" title="حذف المهندس" onclick="deleteEng('${eng.id}')" style="color:var(--danger-tx)">🗑️</button>
        </div>
      </div>
      <div class="progress-bar" style="margin-bottom:${activeTasks.length?'8px':'0'}"><div class="progress-fill" style="width:${avg}%;background:${isAlert?'#E24B4A':'#1D9E75'}"></div></div>
      ${activeTasks.map(t=>`
        <div class="task-row">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
              <span class="task-name">${t.name}</span>
              <span class="badge badge-${t.status}">${statusLabel[t.status]}</span>
              ${deadlineBadge(t.deadline,t.status)}
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${t.pct}%;background:${progressColor(t.status)}"></div></div>
              <span class="pct">${t.pct}%</span>
              <button class="btn btn-sm" onclick="quickUpdate('${eng.id}','${t.id}')" style="font-size:11px;padding:3px 8px">+ Update</button>
              ${eng.phone?`<button class="icon-btn" title="بعت التاسك ده على واتساب" onclick="sendTaskWhatsApp('${eng.id}','${t.id}')" style="color:#25D366;border-color:#25D366">📱</button>`:''}
              <button class="icon-btn" title="هيستوري" onclick="showTaskHistory('${t.id}')">🕐</button>
              <button class="icon-btn" title="أرشيف" onclick="archiveTask('${eng.id}','${t.id}')">📦</button>
              <button class="icon-btn" title="تعديل" onclick="editTask('${eng.id}','${t.id}')">✏️</button>
              <button class="icon-btn" title="حذف" onclick="deleteTask('${eng.id}','${t.id}')">✕</button>
            </div>
          </div>
        </div>`).join('')}
      ${eng.tasks.filter(t=>t.archived).length?`
        <div style="margin-top:6px;padding-top:6px;border-top:0.5px dashed var(--border)">
          <span style="font-size:11px;color:var(--text-muted)">📦 أرشيف (${eng.tasks.filter(t=>t.archived).length})</span>
          ${eng.tasks.filter(t=>t.archived).map(t=>`
            <span style="font-size:12px;color:var(--text-muted);margin-right:8px">${t.name}
              <button class="icon-btn" style="width:20px;height:20px;font-size:10px" onclick="unarchiveTask('${eng.id}','${t.id}')">↩️</button>
            </span>`).join('')}
        </div>`:''}
    </div>`;
  }).join('');
}

function processPdfFile(file){
  selectedPdfName=file.name;

function renderReviewOutput(text, engName, engRole){
  const today=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});

  const escaped=text.replace(/</g,'&lt;').replace(/>/g,'&gt;');

    .replace(/^(\d+\.\s)/gm,'<span style="font-weight:500;color:var(--accent)">$1</span>')
    .replace(/\n\n/g,'</p><p style="margin-bottom:8px">')
    .replace(/\n/g,'<br>');

    <div style="margin-top:20px">
      <div class="report-header">
        <div class="report-title">📋 Review Report — ${engName}</div>

}

}

async function sbFetch(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(SB_URL+path,opts);

  const txt=await res.text();

  t.textContent=msg;t.style.background=err?'#A32D2D':'#0F6E56';t.style.color='#fff';t.style.opacity='1';

  const taskId=document.getElementById('inp-upd-task').value;
  const task=eng&&taskId?eng.tasks.find(t=>t.id===taskId):null;
  const newPct=task?parseInt(document.getElementById('inp-upd-pct').value):null;
  const isoDate=new Date().toISOString().slice(0,10);
  const date=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
  const note=document.getElementById('inp-upd-note').value.trim();
  const id=uid();
  try{
    await sbFetch('/rest/v1/updates','POST',{id,engineer_id:engId,task_id:taskId||null,task_name:task?.name||'',text,note,date,iso_date:isoDate,new_pct:newPct});
    if(task&&newPct!==null){
      await sbFetch('/rest/v1/tasks?id=eq.'+task.id,'PATCH',{pct:newPct});
      task.pct=newPct;
    }
    updates.unshift({id,engId,engName:eng?.name||'',color:eng?.color||COLORS[0],taskName:task?.name||'',text,note,date,isoDate,newPct});
    closeModal('update');renderUpdates();renderEngineers();renderDash();
    showToast('✅ تم الحفظ');
  }catch(e){showToast('❌ '+e.message,true);}
};

window._spliceUpdate=async function(i){
  const u=updates[i];
  try{
    await sbFetch('/rest/v1/updates?id=eq.'+u.id,'DELETE');
    updates.splice(i,1);renderUpdates();
    showToast('✅ تم الحذف');
  }catch(e){showToast('❌ '+e.message,true);}
};

// ---- INIT ----
initColors();
loadData();
</script>
</body>
